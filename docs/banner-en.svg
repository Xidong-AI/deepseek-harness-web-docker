<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="DeepSeek Harness Web Docker">
  <title>DeepSeek Harness Web Docker</title>
  <desc>A single-container deployment of the dsh web client behind Caddy basic auth.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="320" fill="#fafbfc"/>

  <!-- Subtle left accent bar -->
  <rect x="0" y="0" width="6" height="320" fill="#4f46e5"/>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="118" font-size="44" font-weight="700" fill="#0f172a" letter-spacing="-0.5">DeepSeek Harness</text>
    <text x="60" y="172" font-size="44" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Web Docker</text>
    <text x="60" y="212" font-size="18" font-weight="400" fill="#475569">Single container · Caddy basic auth · dsh + data persisted</text>
    <rect x="56" y="232" width="468" height="40" rx="6" ry="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="258" font-size="14" font-weight="500" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">docker compose up -d  →  http://localhost:3080</text>
  </g>

  <!-- Badge group (right) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">

    <!-- Badge 1: docker -->
    <g transform="translate(820, 96)">
      <rect x="0" y="0" width="200" height="36" rx="18" ry="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="18" r="10" fill="#0db7ed"/>
      <!-- docker whale mark simplified -->
      <g transform="translate(12, 10)" fill="#ffffff">
        <rect x="0" y="10" width="3" height="3"/>
        <rect x="4" y="10" width="3" height="3"/>
        <rect x="8" y="10" width="3" height="3"/>
        <rect x="12" y="10" width="3" height="3"/>
        <rect x="16" y="10" width="3" height="3"/>
        <path d="M0,13 L20,13 C20,15 18,16 16,16 L4,16 C2,16 0,15 0,13 Z"/>
      </g>
      <rect x="44" y="0" width="2" height="36" fill="#e2e8f0"/>
      <text x="58" y="23" fill="#0f172a">docker</text>
    </g>

    <!-- Badge 2: caddy -->
    <g transform="translate(820, 146)">
      <rect x="0" y="0" width="200" height="36" rx="18" ry="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="18" r="10" fill="#1f88c0"/>
      <!-- caddy stylized C (vertically centered) -->
      <path d="M16,21 a6,6 0 1,0 12,0" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="44" y="0" width="2" height="36" fill="#e2e8f0"/>
      <text x="58" y="23" fill="#0f172a">caddy</text>
    </g>

    <!-- Badge 3: dsh -->
    <g transform="translate(820, 196)">
      <rect x="0" y="0" width="200" height="36" rx="18" ry="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="18" r="10" fill="#4f46e5"/>
      <text x="22" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">dsh</text>
      <rect x="44" y="0" width="2" height="36" fill="#e2e8f0"/>
      <text x="58" y="23" fill="#0f172a">dsh web client</text>
    </g>
  </g>

  <!-- Subtle bottom border -->
  <line x1="0" y1="319.5" x2="1280" y2="319.5" stroke="#e2e8f0" stroke-width="1"/>
</svg>
