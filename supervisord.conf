[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# socket 服务：固定 /var/run/supervisor.sock，与 Debian supervisorctl 默认路径一致
# 修复：此前缺失该段，supervisord 实际 socket 与 supervisorctl 默认路径不符，docker exec supervisorctl status 报 no such file
#
# Socket server: fixed at /var/run/supervisor.sock, matching the Debian supervisorctl default
# Fix: previously missing, the actual socket did not match supervisorctl's default, so docker exec supervisorctl status failed
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

# RPC 接口：supervisorctl 的 status/tail/stop 等命令依赖该命名空间注册
# 修复：此前缺失该段，supervisorctl status 报 "did not recognize the supervisor namespace commands"
#
# RPC interface: supervisorctl commands (status/tail/stop) require this namespace registration
# Fix: previously missing, supervisorctl status failed with "did not recognize the supervisor namespace commands"
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# dsh Web 客户端
# 仅绑定容器内 loopback，不对外暴露
# 注意：不传 --trusted-host（该 CLI 链路在 rc.6 不可靠），trustedHosts 走 cordis.patch.yml
#
# dsh Web client
# Binds only to the in-container loopback, never exposed externally
# Note: --trusted-host is not passed (unreliable in rc.6); trustedHosts goes through cordis.patch.yml
[program:dsh]
command=/usr/local/bin/dsh --profile web --port 3080
# PATH 继承 entrypoint 注入（含 x-cmd 工具目录）
#
# PATH inherits the entrypoint injection (including the x-cmd tool directory)
user=node
environment=HOME="/home/node"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
stopwaitsecs=30

# Caddy basic auth 反代
#
# Caddy basic auth reverse proxy
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
# PATH 继承 entrypoint 注入（含 x-cmd 工具目录）
#
# PATH inherits the entrypoint injection (including the x-cmd tool directory)
user=node
environment=HOME="/home/node",XDG_DATA_HOME="/home/node/.local/share"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=2
stopwaitsecs=10
